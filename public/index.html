<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voxel Multiplayer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="row">
        <strong>Voxel Multiplayer</strong>
      </div>
      <div class="row">WASD move, Space jump, Mouse look</div>
      <div class="row">Left click break block, Right click place block</div>
      <div class="row">Use keys 1-6 to pick a block type</div>
      <div class="row">Press <kbd>F</kbd> to lock/unlock pointer</div>
      <div class="row">
        Name:
        <input id="nameInput" maxlength="24" placeholder="Enter name" />
      </div>
      <div class="row" id="status">Connecting...</div>
    </div>
    <div id="hotbar"></div>
    <div id="crosshair"></div>
    <canvas id="gameCanvas"></canvas>
    <script type="module" src="client.js"></script>
  </body>
</html>
